# ============================================================
# 工作流名称
# ============================================================
name: Deploy Vue Frontend (Production)

# ============================================================
# 触发条件
# ============================================================
on:
    push:
        branches: [master]
    workflow_dispatch:

# ============================================================
# 权限声明（最小权限原则）
# ============================================================
permissions:
    contents: read

# ============================================================
# 任务定义
# ============================================================
jobs:
    deploy:
        # ==========================================================
        # 指定使用 production 环境
        # 作用：
        # 1. 加载 production 的 secrets 和 variables
        # 2. 如果配了审批人，会在这里卡住等审批
        # 3. GitHub Actions 页面会显示 "production" 标签
        # ==========================================================
        environment: production

        runs-on: ubuntu-latest

        steps:
            # ----------------------------------------------------------
            # 步骤 1：拉代码
            # ----------------------------------------------------------
            - name: Checkout
              uses: actions/checkout@v4

            # ----------------------------------------------------------
            # 临时验证：确认变量都能读到
            # 验证完删掉或注释掉
            # ----------------------------------------------------------
            # - name: Debug - Print variables
            #   run: |
            #     echo "=== Environment Variables (vars) ==="
            #     echo "NODE_VERSION=${{ vars.NODE_VERSION }}"
            #     echo "DEPLOY_PATH=${{ vars.DEPLOY_PATH }}"
            #     echo "VITE_API_BASE=${{ vars.VITE_API_BASE }}"

            #     echo ""
            #     echo "=== Environment Secrets (secrets) ==="
            #     echo "SSH_HOST=${{ secrets.SSH_HOST }}"
            #     echo "SSH_USER=${{ secrets.SSH_USER }}"
            #     echo "SSH_PRIVATE_KEY exists: ${{ secrets.SSH_PRIVATE_KEY != '' }}"

            #     echo ""
            #     echo "=== Environment name ==="
            #     echo "environment=${{ vars.environment || 'not set' }}"

            # ----------------------------------------------------------
            # 步骤 2：安装 Node.js
            # Node 版本从 Environment variables 读取
            # ----------------------------------------------------------
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ vars.NODE_VERSION }}
                  cache: npm

            # ----------------------------------------------------------
            # 步骤 3：安装依赖
            # ----------------------------------------------------------
            - name: Install
              run: npm ci

            # ----------------------------------------------------------
            # 步骤 4：构建
            # 前端环境变量从 Environment variables 读取
            # ----------------------------------------------------------
            - name: Build
              run: npm run build
              env:
                  VITE_API_BASE: ${{ vars.VITE_API_BASE }}

            #调试
            # - name: SSH connection test
            #   uses: appleboy/ssh-action@v1
            #   with:
            #       host: ${{ secrets.SSH_HOST }}
            #       username: ${{ secrets.SSH_USER }}
            #       key: ${{ secrets.SSH_PRIVATE_KEY }}
            #       script: |
            #           echo "✅ SSH OK"
            #           whoami
            #           pwd
            #调试

            # ----------------------------------------------------------
            # 步骤 5：上传 dist 到服务器
            # SSH 信息从 Environment secrets 读取
            # ----------------------------------------------------------
            - name: Upload dist
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  source: 'dist'
                  target: /tmp/frontend-release

            # ----------------------------------------------------------
            # 步骤 6：原子部署
            # 部署路径从 Environment variables 读取
            # ----------------------------------------------------------
            - name: Atomic deploy
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e

                      DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
                      RELEASE_DIR="$DEPLOY_PATH/releases/$(date +%Y%m%d-%H%M%S)"

                      mkdir -p "$RELEASE_DIR"
                      mv /tmp/frontend-release/dist "$RELEASE_DIR/dist"

                      ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"
                      rm -rf /tmp/frontend-release

                      sudo nginx -t
                      sudo systemctl reload nginx

            # ----------------------------------------------------------
            # 步骤 7：健康检查
            # URL 必须整体加引号，否则变量里出现空白会被 shell 拆成
            # 两个参数，多出来的 "/" 会让 curl 以退出码 3 失败。
            # -o /dev/null 防止把整个 index.html 打进日志，
            # -w 只输出状态码，-f 保证非 2xx 时退出码非 0。
            # ----------------------------------------------------------
            - name: Health check
              run: |
                  curl -sfL -o /dev/null -w "%{http_code}\n" \
                      --connect-timeout 10 --max-time 30 \
                      "http://${{ secrets.SSH_HOST }}/"

            # ----------------------------------------------------------
            # 步骤 8：清理旧版本，只保留最近 3 个
            # 放在健康检查之后：新版本有问题就直接失败退出，
            # 旧版本还留着，可以手动把 current 软链切回去。
            # ----------------------------------------------------------
            - name: Prune old releases (keep 3)
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e

                      DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
                      KEEP=3

                      # 下面要执行 rm -rf，DEPLOY_PATH 若为空会把目标算到根目录
                      if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "/" ]; then
                          echo "illegal DEPLOY_PATH: [$DEPLOY_PATH]"
                          exit 1
                      fi

                      mkdir -p "$DEPLOY_PATH/releases"
                      cd "$DEPLOY_PATH/releases"

                      # 目录名是 YYYYmmdd-HHMMSS，字典序即时间序，倒排后
                      # 跳过最新 KEEP 个即为待删列表
                      CURRENT_NAME="$(basename "$(readlink "$DEPLOY_PATH/current" || true)")"

                      # 再排除 current 指向的版本，防止时钟偏差误删线上版本
                      TO_DELETE="$(ls -1 | sort -r | tail -n +$((KEEP + 1)))"

                      if [ -z "$TO_DELETE" ]; then
                          echo "nothing to prune (keep=$KEEP, current=$CURRENT_NAME)"
                          exit 0
                      fi

                      echo "$TO_DELETE" | grep -vx "$CURRENT_NAME" \
                          | xargs -r rm -rf --

                      echo "kept:"
                      ls -1
